name: University CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck critical modules
        run: npm run typecheck:critical

      - name: Run critical education regressions
        run: npm run test:critical

      - name: Audit curriculum content
        run: npm run test:content

      - name: Run full automated test suite
        run: npm test

      - name: Build production bundle
        run: npm run build
